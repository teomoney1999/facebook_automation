name: Build & Release Windows Installer (.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Tạo GitHub Release (true/false)'
        required: false
        default: 'true'
        type: boolean
      tag_name:
        description: 'Release Tag (ví dụ: v2.0.0)'
        required: false
        default: 'v2.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build FacebookBotSetup.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Locate or Install Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and -not (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress
          }

      - name: Build PyInstaller Application Bundle
        run: python -m pyinstaller --clean facebook_bot.spec

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          Write-Host "Using Inno Setup compiler: $iscc"
          & $iscc scripts\installer_windows.iss

      - name: Verify Installer & Compute SHA-256
        id: compute_hash
        shell: pwsh
        run: |
          if (-not (Test-Path "dist_setup\FacebookBotSetup.exe")) {
            Write-Error "FacebookBotSetup.exe not found in dist_setup!"
            exit 1
          }
          $hash = (Get-FileHash dist_setup\FacebookBotSetup.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Calculated SHA-256: $hash"
          $hash | Out-File -FilePath "dist_setup\FacebookBotSetup.exe.sha256" -Encoding ascii -NoNewline
          echo "INSTALLER_SHA256=$hash" >> $env:GITHUB_ENV

      - name: Upload Installer as Workflow Artifact
        uses: actions/upload-artifact@v6
        with:
          name: FacebookBotSetup-windows
          path: |
            dist_setup/FacebookBotSetup.exe
            dist_setup/FacebookBotSetup.exe.sha256

      - name: Determine Release Tag
        id: release_meta
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tag = "${{ github.ref_name }}"
            $should_release = "true"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.create_release }}" -eq "true") {
            $tag = "${{ inputs.tag_name }}"
            $should_release = "true"
          } else {
            $tag = ""
            $should_release = "false"
          }
          echo "TAG_NAME=$tag" >> $env:GITHUB_ENV
          echo "SHOULD_RELEASE=$should_release" >> $env:GITHUB_ENV

      - name: Create or Update GitHub Release
        if: env.SHOULD_RELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Facebook Automation Bot ${{ env.TAG_NAME }}"
          body: |
            ## 🚀 Facebook Automation Bot ${{ env.TAG_NAME }}

            ### Hướng dẫn cài đặt cho người dùng:
            1. Tải file **`FacebookBotSetup.exe`** bên dưới.
            2. Nhấp đúp chuột để cài đặt (Cài đặt Non-Admin, không cần quyền Administrator).
            3. Mở ứng dụng từ biểu tượng ngoài Desktop.
            4. Dữ liệu cá nhân (tài khoản Facebook, danh sách nhóm) được tự động bảo toàn an toàn tại `%LOCALAPPDATA%\FacebookAutomationBot\`.

            ### 🔒 Mã Kiểm Tra SHA-256 (Checksum):
            ```text
            ${{ env.INSTALLER_SHA256 }}
            ```
          files: |
            dist_setup/FacebookBotSetup.exe
            dist_setup/FacebookBotSetup.exe.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
